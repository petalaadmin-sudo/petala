name: Generate DB Baseline

# Manual-only workflow to generate a schema-only baseline for staging/new
# environments. Never apply this baseline to an existing production database.
# The generated artifact must be audited manually before it is versioned.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-schema-baseline:
    name: Generate schema-only baseline
    runs-on: ubuntu-latest
    env:
      BASELINE_PATH: supabase/baselines/2026-05-29_post_034_schema.sql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show pg_dump 17 version
        shell: bash
        run: |
          set -euo pipefail

          # Supabase is on PostgreSQL 17. Use the official postgres:17 image so
          # pg_dump is not older than the server version.
          docker run --rm postgres:17 pg_dump --version

      - name: Generate schema-only baseline
        shell: bash
        env:
          PROD_DB_SCHEMA_HOST: ${{ secrets.PROD_DB_SCHEMA_HOST }}
          PROD_DB_SCHEMA_PORT: ${{ secrets.PROD_DB_SCHEMA_PORT }}
          PROD_DB_SCHEMA_NAME: ${{ secrets.PROD_DB_SCHEMA_NAME }}
          PROD_DB_SCHEMA_USER: ${{ secrets.PROD_DB_SCHEMA_USER }}
          PROD_DB_SCHEMA_PASSWORD: ${{ secrets.PROD_DB_SCHEMA_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            PROD_DB_SCHEMA_HOST \
            PROD_DB_SCHEMA_PORT \
            PROD_DB_SCHEMA_NAME \
            PROD_DB_SCHEMA_USER \
            PROD_DB_SCHEMA_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required GitHub secret ${secret_name}." >&2
              exit 1
            fi
          done

          mkdir -p "$(dirname "$BASELINE_PATH")"

          # Schema-only dump for audit/versioning. This command does not apply
          # SQL to any database and intentionally keeps grants/revokes for review.
          # Separate secrets avoid URL encoding issues and pooler username parsing.
          # Run pg_dump from postgres:17 for compatibility with Supabase Postgres 17.
          docker run --rm \
            -e PGPASSWORD="$PROD_DB_SCHEMA_PASSWORD" \
            -v "$PWD:/work" \
            -w /work \
            postgres:17 \
            pg_dump \
              --host "$PROD_DB_SCHEMA_HOST" \
              --port "$PROD_DB_SCHEMA_PORT" \
              --username "$PROD_DB_SCHEMA_USER" \
              --dbname "$PROD_DB_SCHEMA_NAME" \
              --schema-only \
              --no-owner \
              --no-password \
              --file "$BASELINE_PATH"

          test -s "$BASELINE_PATH"

      - name: Run baseline safety checks
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for data export markers..."

          fatal_data_marker=0
          max_findings=20

          report_context() {
            local label="$1"
            local pattern="$2"
            local fatal="$3"
            local total
            local matches

            total="$(grep -Ec "$pattern" "$BASELINE_PATH" || true)"
            echo "${label}: ${total}"

            if [ "$total" -eq 0 ]; then
              return
            fi

            if [ "$fatal" = "true" ]; then
              fatal_data_marker=1
            else
              echo "Non-fatal warning: ${label} can be valid inside function/RPC bodies, but must be reviewed manually."
            fi

            mapfile -t matches < <(grep -nE "$pattern" "$BASELINE_PATH" | head -n "$max_findings" || true)

            echo "Showing up to ${max_findings} contextual matches for ${label}:"
            for match in "${matches[@]}"; do
              local line_number
              local start_line
              local end_line

              line_number="${match%%:*}"
              start_line=$(( line_number > 3 ? line_number - 3 : 1 ))
              end_line=$(( line_number + 3 ))

              echo "::group::${label} near line ${line_number}"
              sed -n "${start_line},${end_line}p" "$BASELINE_PATH" | nl -ba -v "$start_line"
              echo "::endgroup::"
            done

            if [ "$total" -gt "$max_findings" ]; then
              echo "Additional ${label} matches omitted: $(( total - max_findings ))"
            fi
          }

          report_context "absolute INSERT lines" '^INSERT[[:space:]]' true
          report_context "absolute COPY lines" '^COPY[[:space:]]' true
          report_context "indented INSERT lines" '^[[:space:]]+INSERT[[:space:]]' false
          report_context "indented COPY lines" '^[[:space:]]+COPY[[:space:]]' false

          if [ "$fatal_data_marker" -ne 0 ]; then
            echo "Unexpected absolute INSERT/COPY markers found in schema-only baseline. Artifact upload is blocked until this is reviewed." >&2
            exit 1
          fi

          echo "No absolute INSERT/COPY data export markers found."
          echo "Indented INSERT/COPY markers, if present, were reported for manual review and do not block artifact upload."

          echo "Review signal counts. These are non-fatal because they can be schema identifiers:"
          for pattern in '@' 'pix_key' 'token' 'secret' 'password' 'api_key' 'auth\.users' 'metadata'; do
            count="$(grep -Eic "$pattern" "$BASELINE_PATH" || true)"
            echo "${pattern}: ${count}"
          done

          echo "Baseline line count: $(wc -l < "$BASELINE_PATH")"
          echo "Baseline byte count: $(wc -c < "$BASELINE_PATH")"

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-034-schema-baseline
          path: ${{ env.BASELINE_PATH }}
          if-no-files-found: error
          retention-days: 1
